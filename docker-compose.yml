version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eventsourcing-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventsourcing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - eventsourcing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  kong:
    image: kong:3.4
    container_name: kong-gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_URL: http://localhost:8002
    ports:
      - "8000:8000"   # Kong Proxy
      - "8001:8001"   # Kong Admin API
      - "8002:8002"   # Kong Manager (GUI)
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    networks:
      - eventsourcing-network
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ratelimit:
    image: envoyproxy/ratelimit:master
    ports:
      - "8080:8080"
      - "8081:8081"
      - "6070:6070"
    environment:
      - USE_STATSD=false
      - LOG_LEVEL=info
      - REDIS_SOCKET_TYPE=tcp
      - REDIS_URL=redis:6379
      - RUNTIME_ROOT=/data
      - RUNTIME_SUBDIRECTORY=ratelimit
      - RUNTIME_WATCH_ROOT=false
    volumes:
      - ./envoy:/data/ratelimit/config
    networks:
      - eventsourcing-network
    depends_on:
      - redis
    command: /bin/ratelimit

  redis:
    image: redis:7.2.4
    ports:
      - "6379:6379"
    networks:
      - eventsourcing-network

  balance-api:
    build:
      context: ./balance-api
      dockerfile: Dockerfile.dev
    container_name: eventsourcing-balance-api
    environment:
      # ScyllaDB Configuration
      SCYLLA_HOSTS: balance-scylla:9042
      SCYLLA_KEYSPACE: balance_ks
      SCYLLA_USERNAME: ""
      SCYLLA_PASSWORD: ""
      SCYLLA_PORT: 9042
      SCYLLA_CONSISTENCY: QUORUM
      SCYLLA_TIMEOUT: 10s
      SCYLLA_CONNECT_TIMEOUT: 10s
      SCYLLA_PROTO_VERSION: 4
      SCYLLA_RETRY_ATTEMPTS: 3

      # Server Configuration
      PORT: 8083
      SERVER_READ_TIMEOUT: 30s
      SERVER_WRITE_TIMEOUT: 30s

      # Application Configuration
      ENVIRONMENT: production
      LOG_LEVEL: info
    ports:
      - "8083:8083"
    volumes:
      - ./balance-api:/app
    networks:
      - eventsourcing-network
    depends_on:
      balance-scylla:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: air -c .air.toml

  balance-ingestion:
    build:
      context: ./balance
      dockerfile: Dockerfile.dev
    container_name: eventsourcing-balance-ingestion
    environment:
      # ScyllaDB Configuration
      SCYLLA_HOSTS: balance-scylla:9042
      SCYLLA_KEYSPACE: balance
      SCYLLA_USERNAME: ""
      SCYLLA_PASSWORD: ""
      SCYLLA_PORT: 9042

      # Kafka Brokers
      KAFKA_BROKERS: kafka:29092

      # Kafka Consumer Topics
      KAFKA_TOPIC_SALDO_ATUALIZADO: ledger_saldo_atualizado
      KAFKA_TOPIC_NOVA_CONTA_REGISTRADA: ledger_nova_conta_registrada

      # Kafka Consumer Groups
      KAFKA_GROUP_BALANCE: balance-ingestion-group
      KAFKA_GROUP_ACCOUNTS: balance-accounts-group

      # Application Configuration
      PORT: 8082
      ENVIRONMENT: production
      LOG_LEVEL: info
    ports:
      - "8082:8082"
    volumes:
      - ./balance:/app
    networks:
      - eventsourcing-network
    depends_on:
      balance-scylla:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: air -c .air.toml

  balance-scylla:
    image: scylladb/scylla:2025.3
    container_name: eventsourcing-balance-scylla
    ports:
      - "9042:9042"
    networks:
      - eventsourcing-network
    command: --smp 1 --memory 512M
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  statements-mongo:
    image: mongo:7-jammy
    container_name: statements-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: extrato
    volumes:
      - mongo_data:/data/db
    networks:
      - eventsourcing-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  statements-ingestion:
    build:
      context: ./statement
      dockerfile: Dockerfile.dev
    container_name: eventsourcing-statements-ingestion
    environment:
      # MongoDB Configuration
      MONGODB_HOSTS: statements-mongo:27017
      MONGODB_DATABASE: extrato
      MONGODB_USERNAME: ""
      MONGODB_PASSWORD: ""
      MONGODB_URI: ""
      MONGODB_CONNECT_TIMEOUT: 10s
      MONGODB_QUERY_TIMEOUT: 5s
      MONGODB_MAX_POOL_SIZE: 100
      MONGODB_MIN_POOL_SIZE: 10

      # Kafka Brokers
      KAFKA_BROKERS: kafka:29092

      # Kafka Consumer Topics
      KAFKA_TOPIC_TRANSACTION_CONFIRMED: ledger_nova_transacao_confirmada

      # Kafka Consumer Groups
      KAFKA_GROUP_STATEMENT: statement-ingestion-group

      # Application Configuration
      PORT: 8084
      ENVIRONMENT: production
      LOG_LEVEL: info
    ports:
      - "8084:8084"
    volumes:
      - ./statement:/app
    networks:
      - eventsourcing-network
    depends_on:
      statements-mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: air -c .air.toml


  statements-api:
    build:
      context: ./statement-api
      dockerfile: Dockerfile.dev
    container_name: eventsourcing-statements-api
    environment:
      # MongoDB Configuration
      MONGODB_HOSTS: statements-mongo:27017
      MONGODB_DATABASE: extrato
      MONGODB_USERNAME: ""
      MONGODB_PASSWORD: ""
      MONGODB_URI: ""
      MONGODB_CONNECT_TIMEOUT: 10s
      MONGODB_QUERY_TIMEOUT: 10s
      MONGODB_MAX_POOL_SIZE: 100
      MONGODB_MIN_POOL_SIZE: 10

      # HTTP Server Configuration
      PORT: 8085
      SERVER_READ_TIMEOUT: 10s
      SERVER_WRITE_TIMEOUT: 10s

      # Application Configuration
      ENVIRONMENT: production
      LOG_LEVEL: info
    ports:
      - "8085:8085"
    volumes:
      - ./statement-api:/app
    networks:
      - eventsourcing-network
    depends_on:
      statements-mongo:
        condition: service_healthy
    command: air -c .air.toml

  simulador:
    build:
      context: ./simulador
      dockerfile: Dockerfile.dev
    container_name: eventsourcing-simulador
    environment:
      # Kafka Configuration
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_CONTA_CRIADA: conta_criada
      KAFKA_TOPIC_CONTA_MOVIMENTACAO: conta_movimentacao
      KAFKA_REQUIRED_ACKS: 1
      KAFKA_ASYNC: true
      KAFKA_BATCH_SIZE: 100
      KAFKA_BATCH_TIMEOUT: 10ms
      KAFKA_COMPRESSION: snappy

      # Simulation Configuration
      SIM_NUM_CONTAS: 15
      SIM_CONTINUOUS_MODE: true
      SIM_NUM_MOVIMENTACOES: 100
      SIM_NUM_WORKERS: 1
      SIM_EVENTS_PER_WORKER: 1
      SIM_SLEEP_BETWEEN_EVENTS: 1s
      SIM_CREDITO_PROBABILITY: 0.7
      SIM_TRANSFER_PROBABILITY: 0.2
      SIM_WAIT_AFTER_CREATE: 10s

      # Application Configuration
      ENVIRONMENT: production
      LOG_LEVEL: info
    volumes:
      - ./simulador:/app
    networks:
      - eventsourcing-network
    depends_on:
      kafka:
        condition: service_healthy
    command: air -c .air.toml

  ledger:
    build:
      context: ./ledger
      dockerfile: Dockerfile.dev
    container_name: eventsourcing-ledger
    environment:
      # Database Configuration
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/eventsourcing?sslmode=disable
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_DB: eventsourcing
      DATABASE_SSL_MODE: disable

      # Kafka Brokers
      KAFKA_BROKERS: kafka:29092

      # Kafka Consumer Topics
      KAFKA_TOPIC_CONTA_CRIADA: conta_criada
      KAFKA_TOPIC_CONTA_MOVIMENTACAO: conta_movimentacao
      KAFKA_TOPIC_REHYDRATATE: ledger_rehydratate_transactions

      # Kafka Producer Topics
      KAFKA_TOPIC_NOVA_CONTA_REGISTRADA: ledger_nova_conta_registrada
      KAFKA_TOPIC_NOVA_TRANSACAO_CONFIRMADA: ledger_nova_transacao_confirmada
      KAFKA_TOPIC_SALDO_ATUALIZADO: ledger_saldo_atualizado

      # Kafka Consumer Groups
      KAFKA_GROUP_ACCOUNT: ledger-account-group
      KAFKA_GROUP_TRANSACTION: ledger-transaction-group
      KAFKA_GROUP_REHYDRATE: ledger-rehydrate-group

      # Rate Limiter
      RATELIMIT_SERVICE: ratelimit:8080

      # Application Configuration
      PORT: 8081
      ENVIRONMENT: production
      LOG_LEVEL: info
    ports:
      - "8081:8081"
    volumes:
      - ./ledger:/app
    networks:
      - eventsourcing-network
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: air -c .air.toml

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      # KRaft settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      
      # Listeners
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      
      # Cluster settings
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      
      # Log settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    networks:
      - eventsourcing-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - eventsourcing-network


volumes:
  postgres_data:
  kafka-data:
  mongo_data:

networks:
  eventsourcing-network:
    driver: bridge
